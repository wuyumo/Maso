<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Masso · 心率提示样式</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9ece9;color:#142019;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{padding:32px clamp(20px,5vw,72px) 12px}header small{letter-spacing:.16em;font-weight:700;color:#468b5c}h1{font-size:clamp(28px,4vw,46px);margin:14px 0 8px}header p{color:#5c6c61}main{padding:24px clamp(20px,5vw,72px) 72px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px}.item{min-width:0;cursor:pointer;border-radius:7px;outline:3px solid transparent;outline-offset:8px}.item.selected{outline-color:#1dc75c}.item:focus-visible{outline-color:#1dc75c}.meta{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;font-weight:700}.meta small{color:#64756a;font-size:13px;font-weight:400}.poster{position:relative;overflow:hidden;aspect-ratio:1206/2622;background:#1d1f1e;color:#f7f7f7;border-radius:4px}.brand{position:absolute;top:3.5%;right:7%;font-size:clamp(8px,1vw,14px);letter-spacing:.12em;font-weight:800}.brand b{color:#1ed760}.heading{position:absolute;top:9%;left:8%;right:8%;font-weight:750;font-size:clamp(19px,2.2vw,33px);line-height:1.08;letter-spacing:-.03em}.heading em{font-style:normal;color:#1ed760}.phone{position:absolute;left:5%;width:90%;top:20%;border:3px solid #4a4a4a;border-radius:11% 11% 4% 4%;overflow:hidden;box-shadow:0 3px 20px #0009}.phone img{display:block;width:100%;height:auto}.note{position:absolute;z-index:2;font-size:clamp(10px,1.08vw,16px);line-height:1.18;font-weight:700} .note{top:35%;left:7%;width:70%;padding:11px 13px;color:#fff;border:1px solid #ffffff40;box-shadow:inset 0 1px #ffffff47,0 7px 22px #0006;backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%)}
.note::after{content:'';position:absolute;right:14%;top:-8px;width:14px;height:14px;transform:rotate(45deg);background:inherit;border-left:1px solid #ffffff40;border-top:1px solid #ffffff40;z-index:-1}
.g1{background:#252a28ba;border-radius:14px}.g2{background:#b3bdbd82;color:#fff;border-color:#ffffff78;border-radius:17px;box-shadow:inset 0 1px 2px #ffffffb0,0 9px 24px #0007}.g3{background:#216e3fb8;border-color:#9dffc080;border-radius:16px}.g4{top:34%;width:76%;padding:12px 15px;background:#191e1dc9;border-radius:999px;border-color:#ffffff55}.g4::after{display:none}.g4 .icon{float:left;display:grid;place-items:center;margin:0 8px 0 0;width:28px;height:28px;border-radius:50%;color:#ff7777;background:#ffffff1e}.g5{background:#101813bc;border-radius:18px;border-color:#79f3a278;padding:12px}.g5 .eyebrow{display:block;color:#64f099;font-size:.68em;letter-spacing:.1em;margin-bottom:5px}
.hint{margin-top:10px;color:#5b6a60;font-size:13px;line-height:1.5}footer{padding:0 5vw 40px;color:#68756b;font-size:13px}</style>
<header><small>MASSO / DESIGN EXPLORATION</small><h1>心率提醒，怎么呈现？</h1><p>五种玻璃质感 · 同一张真实训练截图。点击样式，告诉我编号。</p></header><main>
<script>const configs=[['01','深色磨砂','g1','沉稳，贴近系统深色界面'],['02','浅色透玻璃','g2','更通透，边缘轻微高光'],['03','绿色玻璃','g3','融入 Masso 主题色'],['04','玻璃胶囊','g4','圆润紧凑，带心率图标'],['05','分层玻璃','g5','深色磨砂搭配绿色标签']];const main=document.querySelector('main');for(const [n,title,cls,description] of configs){let section=document.createElement('section');section.className='item';section.tabIndex=0;section.setAttribute('role','button');section.setAttribute('aria-label','选择 '+n+' '+title);section.onclick=()=>{document.querySelectorAll('.item').forEach(el=>el.classList.remove('selected'));section.classList.add('selected');document.getElementById('selection').textContent='已选择 '+n+' / '+title+'，告诉我后我会应用到主页面。'};section.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();section.click()}};section.innerHTML=`<div class="meta"><span>${n} / ${title}</span><small>${description}</small></div><div class="poster"><div class="brand"><b>▰</b> MASSO</div><div class="heading">Stay focused on<br><em>every rep</em></div><div class="phone"><img src="/screenshots/apple/iphone/training-native.png" alt="训练中的真实 App 截图"></div><div class="note ${cls}">${cls==='g4'?'<span class="icon">♡</span>':''}${cls==='g5'?'<span class="eyebrow">HEART RATE</span>':''}Heart rate alerts when you exceed your limit</div></div><div class="hint">${description}</div>`;main.append(section)}</script></main><footer><p id="selection" aria-live="polite">点击选一个样式。</p>此页为设计预览，心率阈值由用户自行设置；提醒需持续超出设定上限。</footer></html>
