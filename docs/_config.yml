# GitHub Pages — project site source is this /docs folder.
# Published at https://wuyumo.github.io/Maso/ (not the host root).
# Repo Settings → Pages → Deploy from a branch → main → /docs.
# This repository cannot publish https://wuyumo.github.io/robots.txt.
# A project-path robots.txt and sitemap are generated from /docs instead.

theme: jekyll-theme-cayman

title: Masso — AI Workout Planner
description: Plan workouts with AI Coach, log every set, and review training, recovery, meals, and sleep. Free iPhone app by Yumo Wu.
url: "https://wuyumo.github.io"
baseurl: "/Maso"
lang: en

app_store_url: "https://apps.apple.com/us/app/masso-ai-workout-planner/id6776689750"
support_email: "wuyumoawuyumo@gmail.com"
social_image: /ph/thumbnail.png
listing_checked: "9 November 2026"

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Engineering notes stay in the repo. They are not product pages.
# The layout marks anything outside the public list as noindex.
# privacy-policy.md, terms.md, support.md, and index.html stay public.
exclude:
  - app-store-metadata.md
  - app-store-connect-walkthrough.md
  - cloudkit-todo.md
  - exercise-hd-upgrade.md
  - exercise-media-upgrade.md
  - exercise-data-mapping.md
  - i18n-workflow.md
  - session-memory-*.md
